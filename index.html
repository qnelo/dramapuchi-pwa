<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tamagotchi PWA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: #141416;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace;
      color: #eee;
      padding: 16px 12px;
      overflow-x: hidden;
    }

    /* 1996 Keychain Oval Shell - Calibrated bounds */
    .tama-shell {
      width: 320px;
      max-width: 92vw;
      height: 410px;
      max-height: 70vh;
      background: radial-gradient(circle at 35% 25%, #ff5a67, #c9182b 70%, #800f1b);
      border-radius: 50% 50% 46% 46% / 56% 56% 44% 44%;
      box-shadow:
        inset -8px -12px 20px rgba(0,0,0,0.45),
        inset 6px 8px 16px rgba(255,255,255,0.35),
        0 16px 36px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 24px 20px;
      position: relative;
    }

    /* Keychain top metal ring */
    .keychain-ring {
      width: 36px;
      height: 22px;
      border: 5px solid #c0c5ce;
      border-radius: 50%;
      position: absolute;
      top: -14px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.5);
    }

    /* Sunken screen bezel - Center-fitted */
    .screen-bezel {
      background: #8b9574;
      border: 5px solid #4a4e42;
      border-radius: 14px;
      padding: 6px 8px;
      box-shadow: inset 3px 3px 6px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      width: 216px;
      max-width: 82%;
    }

    /* Top and bottom rows of 4 status icons */
    .icon-row {
      display: flex;
      justify-content: space-around;
      width: 100%;
      font-size: 13px;
      line-height: 1;
      color: rgba(27, 36, 22, 0.22);
      padding: 2px 0;
    }
    .icon-row span {
      transition: color 0.1s, text-shadow 0.1s;
    }
    .icon-row span.active {
      color: #1b2416;
      text-shadow: 0 0 2px rgba(27,36,22,0.5);
    }

    /* 32x16 dot matrix with exact 2:1 ratio */
    canvas {
      width: 192px; /* Exact 6x scale: 32 * 6 = 192 */
      height: 96px;  /* 16 * 6 = 96 */
      display: block;
      margin: 0 auto;
      border-radius: 2px;
    }

    /* Three physical tactile buttons (A, B, C) */
    .controls {
      display: flex;
      gap: 24px;
      margin-top: 22px;
      align-items: flex-start;
    }
    .btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .btn-container.btn-center {
      margin-top: 10px;
    }
    .hw-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 30% 30%, #ffd166, #d49b00);
      box-shadow: 0 5px 0 #7a5800, 0 6px 10px rgba(0,0,0,0.5);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.05s, box-shadow 0.05s;
    }
    .hw-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #7a5800, 0 2px 4px rgba(0,0,0,0.5);
    }
    .btn-label {
      font-size: 11px;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 1px;
    }

    /* Mobile-first bottom QoL toolbar */
    .qol-toolbar {
      margin-top: 20px;
      display: flex;
      gap: 8px;
      font-size: 12px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 360px;
      width: 100%;
    }
    .qol-toolbar select {
      background: #232529;
      color: #ffd166;
      border: 1px solid #555;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
      font-size: 12px;
      font-weight: 500;
      outline: none;
    }
    .qol-toolbar select:focus {
      border-color: #ffd166;
    }
    .qol-toolbar button {
      background: #232529;
      color: #ddd;
      border: 1px solid #3e4249;
      padding: 7px 11px;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
      font-size: 12px;
      transition: background 0.15s, border-color 0.15s;
    }
    .qol-toolbar button:active {
      background: #34373d;
      transform: scale(0.97);
    }
    .qol-toolbar button.btn-highlight {
      border-color: #ffd166;
      color: #ffd166;
    }

    /* Native modal dialog for instruction manual */
    dialog#modal-manual {
      background: #1c1e24;
      color: #eee;
      border: 1px solid #3e4249;
      border-radius: 16px;
      box-shadow: 0 20px 48px rgba(0,0,0,0.85);
      max-width: 440px;
      width: 90vw;
      max-height: 82vh;
      max-height: 82dvh;
      padding: 0;
      overflow: hidden;
      flex-direction: column;
    }
    dialog#modal-manual[open] {
      display: flex;
    }
    dialog#modal-manual:not([open]) {
      display: none;
    }
    dialog#modal-manual::backdrop {
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .modal-header {
      background: #24272e;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #343842;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
    }
    .btn-close-modal {
      background: #2d313a;
      border: none;
      color: #ccc;
      font-size: 18px;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      touch-action: manipulation;
    }
    .btn-close-modal:active {
      background: #444a57;
    }
    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
      overscroll-behavior: contain;
    }
    .manual-section {
      margin-bottom: 16px;
    }
    .manual-section:last-child {
      margin-bottom: 4px;
    }
    .manual-section h3 {
      font-size: 13px;
      color: #ffd166;
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #2e323b;
      padding-bottom: 4px;
    }
    .manual-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .manual-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .manual-icon {
      font-size: 16px;
      min-width: 24px;
      text-align: center;
    }
    .manual-item-desc {
      flex: 1;
    }
    .badge {
      display: inline-block;
      background: #2b2e36;
      border: 1px solid #444;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 11px;
      color: #ffd166;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="tama-shell">
    <div class="keychain-ring"></div>
    <div class="screen-bezel">
      <!-- Top Bezel: Feed, Light, Game, Medicine -->
      <div class="icon-row">
        <span id="icon-0" title="Feed">🍴</span>
        <span id="icon-1" title="Light">💡</span>
        <span id="icon-2" title="Game">⚾</span>
        <span id="icon-3" title="Medicine">💉</span>
      </div>
      <!-- 32x16 LCD Matrix -->
      <canvas id="lcdScreen"></canvas>
      <!-- Bottom Bezel: Clean, Scale, Discipline, Attention -->
      <div class="icon-row">
        <span id="icon-4" title="Clean">🚿</span>
        <span id="icon-5" title="Scale">⚖️</span>
        <span id="icon-6" title="Discipline">💢</span>
        <span id="icon-7" title="Attention">🔔</span>
      </div>
    </div>
    <!-- Hardware Buttons A, B, C -->
    <div class="controls">
      <div class="btn-container">
        <button id="btn-a" class="hw-btn" aria-label="A"></button>
        <span class="btn-label">A</span>
      </div>
      <div class="btn-container btn-center">
        <button id="btn-b" class="hw-btn" aria-label="B"></button>
        <span class="btn-label">B</span>
      </div>
      <div class="btn-container">
        <button id="btn-c" class="hw-btn" aria-label="C"></button>
        <span class="btn-label">C</span>
      </div>
    </div>
  </div>

  <!-- Mobile-first QoL Toolbar -->
  <div class="qol-toolbar">
    <select id="select-lang" aria-label="Language / Idioma">
      <option value="en">🇬🇧 English</option>
      <option value="es">🇪🇸 Español</option>
      <option value="zh">🇨🇳 中文</option>
      <option value="pt">🇧🇷 Português</option>
    </select>
    <button id="btn-manual" class="btn-highlight">📖 Manual</button>
    <button id="btn-sitter">👶 Sitter: OFF</button>
    <button id="btn-backlight">🌙 LED Light</button>
    <button id="btn-export">💾 Export</button>
    <button id="btn-import">📂 Import</button>
    <button id="btn-sound">🔊 Audio</button>
    <button id="btn-reset">🥚 New Egg</button>
    <input type="file" id="file-import" accept=".json" style="display:none">
  </div>

  <!-- Instruction Manual Modal -->
  <dialog id="modal-manual" closedby="any" aria-labelledby="manual-title">
    <div class="modal-header">
      <h2 id="manual-title">📖 Tamagotchi Manual</h2>
      <button id="btn-close-modal" class="btn-close-modal" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <!-- Buttons Section -->
      <div class="manual-section">
        <h3 id="manual-sec-buttons-title">🔘 Keychain Buttons</h3>
        <div class="manual-list">
          <div class="manual-item">
            <span class="badge">A</span>
            <div id="manual-btn-a-desc" class="manual-item-desc"></div>
          </div>
          <div class="manual-item">
            <span class="badge">B</span>
            <div id="manual-btn-b-desc" class="manual-item-desc"></div>
          </div>
          <div class="manual-item">
            <span class="badge">C</span>
            <div id="manual-btn-c-desc" class="manual-item-desc"></div>
          </div>
        </div>
      </div>

      <!-- Icons Section -->
      <div class="manual-section">
        <h3 id="manual-sec-icons-title">📟 8 Care Icons</h3>
        <div class="manual-list">
          <div class="manual-item">
            <span class="manual-icon">🍴</span>
            <div id="manual-icon-0-desc" class="manual-item-desc"></div>
          </div>
          <div class="manual-item">
            <span class="manual-icon">💡</span>
            <div id="manual-icon-1-desc" class="manual-item-desc"></div>
          </div>
          <div class="manual-item">
            <span class="manual-icon">⚾</span>
            <div id="manual-icon-2-desc" class="manual-item-desc"></div>
          </div>
          <div class="manual-item">
            <span class="manual-icon">💉</span>
            <div id="manual-icon-3-desc" class="manual-item-desc"></div>
          </div>
          <div class="manual-item">
            <span class="manual-icon">🚿</span>
            <div id="manual-icon-4-desc" class="manual-item-desc"></div>
          </div>
          <div class="manual-item">
            <span class="manual-icon">⚖️</span>
            <div id="manual-icon-5-desc" class="manual-item-desc"></div>
          </div>
          <div class="manual-item">
            <span class="manual-icon">💢</span>
            <div id="manual-icon-6-desc" class="manual-item-desc"></div>
          </div>
          <div class="manual-item">
            <span class="manual-icon">🔔</span>
            <div id="manual-icon-7-desc" class="manual-item-desc"></div>
          </div>
        </div>
      </div>

      <!-- Lifecycle & Tips Section -->
      <div class="manual-section">
        <h3 id="manual-sec-lifecycle-title">🌱 Lifecycle & Pro Tips</h3>
        <p id="manual-lifecycle-desc" style="margin:4px 0 8px 0;"></p>
        <p id="manual-sitter-desc" style="margin:0;"></p>
      </div>
    </div>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
